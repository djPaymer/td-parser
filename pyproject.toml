[project]
name = "td-parser"
version = "0.3.0"
description = "CLI: collect products (URL, name, description, specs) from manufacturer sites listed in an Excel file"
authors = [
    {name = "selin.pa",email = "selin.pa@krskcit.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "openai (>=3.7.0,<4.0.0)",
    "openpyxl (>=3.1,<4.0)",
    "beautifulsoup4 (>=4.12,<5.0)",
    "lxml (>=5.0,<7.0)",
    "playwright (>=1.50,<2.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
